# Paleta vga (console Linux) — mesma do kitty (~/.config/kitty/cores/vga.conf)
[meta]
version = 1
name = "VGA"
description = "Console Linux: preto puro, cores VGA"
variant = "dark"

[colors.core]
background = "#000000"
foreground = "#AAAAAA"
secondary_background = "#000000"
border = "#555555"
accent = "#AAAAAA"

[colors.accents]
blue = "#5555FF"
green = "#55FF55"
magenta = "#FF55FF"
orange = "#AA5500"
purple = "#AA00AA"
red = "#FF5555"
yellow = "#FFFF55"
cyan = "#55FFFF"

[colors.list.item.selection]
background = "#AAAAAA"
secondary_background = "#555555"

[colors.grid.item]
background = "#000000"
