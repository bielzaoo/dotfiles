# Paleta: vga (Terminal Mode). Fonte da verdade das cores: o `repinta` gera o
# kitty (~/.config/kitty/cor-atual.conf) e o resto do desktop a partir daqui.
# Formato: "papel #hex". Nas paletas do Terminal Mode os papéis são as cores
# ANSI de sempre (destaque = color7, apagado/borda = color8, erro = color9,
# ok = color10), por isso o modo continua idêntico.

# --- Papéis ---
fundo-fundo  #000000
fundo-barra  #000000
fundo        #000000
superficie   #555555
borda        #555555
apagado      #555555
texto-2      #aaaaaa
texto        #aaaaaa
destaque     #aaaaaa
destaque-2   #5555ff
icone        #ff55ff
info         #55ffff
ok           #55ff55
aviso        #ffff55
numero       #aa5500
erro         #ff5555

# --- Terminal (kitty) ---
cursor               #aaaaaa
selection_background #aaaaaa
selection_foreground #000000
color0 #000000
color1 #aa0000
color2 #00aa00
color3 #aa5500
color4 #0000aa
color5 #aa00aa
color6 #00aaaa
color7 #aaaaaa
color8 #555555
color9 #ff5555
color10 #55ff55
color11 #ffff55
color12 #5555ff
color13 #ff55ff
color14 #55ffff
color15 #ffffff
