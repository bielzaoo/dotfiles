# Paleta: grafite (Terminal Mode). Fonte da verdade das cores: o `repinta` gera o
# kitty (~/.config/kitty/cor-atual.conf) e o resto do desktop a partir daqui.
# Formato: "papel #hex". Nas paletas do Terminal Mode os papéis são as cores
# ANSI de sempre (destaque = color7, apagado/borda = color8, erro = color9,
# ok = color10), por isso o modo continua idêntico.

# --- Papéis ---
fundo-fundo  #111111
fundo-barra  #111111
fundo        #111111
superficie   #5c5c5c
borda        #5c5c5c
apagado      #5c5c5c
texto-2      #c8c8c8
texto        #c8c8c8
destaque     #b0b0b0
destaque-2   #8aa8cc
icone        #bf98c4
info         #8cc4c4
ok           #a5c287
aviso        #e0c07a
numero       #c9a55a
erro         #d97b7b

# --- Terminal (kitty) ---
cursor               #c8c8c8
selection_background #3a3a3a
selection_foreground #e8e8e8
color0 #111111
color1 #c25d5d
color2 #8aa66a
color3 #c9a55a
color4 #6b8bb3
color5 #a07aa8
color6 #6aa6a6
color7 #b0b0b0
color8 #5c5c5c
color9 #d97b7b
color10 #a5c287
color11 #e0c07a
color12 #8aa8cc
color13 #bf98c4
color14 #8cc4c4
color15 #e8e8e8
