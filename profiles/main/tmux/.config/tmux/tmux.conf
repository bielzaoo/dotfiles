# ============================================================
# tmux.conf (perfil main)
# Keybinds iguais aos do common/tmux (esquema do Omarchy: Ctrl+Alt+setas pros
# painéis, Alt+número e Alt+setas pras janelas, sem prefix pro que é usado
# toda hora). O tema é outro: só cores ANSI (colour0..15), então segue o
# rodízio de `cor` do kitty sozinho, sem ícone Nerd Font (Spleen não tem).
# Papéis iguais aos do repinta: ativo colour7, apagado colour8, ok colour10.
# ============================================================

# --- Prefix: Ctrl+Space (Omarchy), Ctrl+a continua valendo ---
set -g prefix C-Space
set -g prefix2 C-a
bind C-Space send-prefix

# Toda bind nossa leva -N (nota): o `atalhos` (WIN+K) lista por ela. Padrão do
# tmux que vale lembrar entra como comentário `#: tecla | descrição`.
#: Ctrl+Space | Prefix (o "prefix" desta lista; Ctrl+a também vale)
#: prefix d | Soltar a sessão (fecha a janela, a sessão segue rodando)
#: prefix z | Maximizar/voltar o painel
#: prefix [ | Copy mode (v seleciona, y copia pro clipboard)
#: prefix ? | Todos os atalhos do tmux, inclusive os padrões

# Recarrega a config
bind -N "Recarregar a config" q source-file ~/.config/tmux/tmux.conf \; display "Config recarregada"

# --- Painéis ---
# h = divide na horizontal (um embaixo do outro), v = lado a lado
bind -N "Dividir: um embaixo do outro" h split-window -v -c "#{pane_current_path}"
bind -N "Dividir: lado a lado" v split-window -h -c "#{pane_current_path}"
bind -N "Fechar painel" x kill-pane

# Ctrl+Alt+setas: muda de painel; com Shift: redimensiona
bind -N "Painel à esquerda (Ctrl+Alt+setas)" -n C-M-Left select-pane -L
bind -N "Painel à direita" -n C-M-Right select-pane -R
bind -N "Painel de cima" -n C-M-Up select-pane -U
bind -N "Painel de baixo" -n C-M-Down select-pane -D

bind -N "Redimensionar painel (Ctrl+Alt+Shift+setas)" -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# --- Janelas ---
bind -N "Renomear janela" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Nova janela (mesma pasta)" c new-window -c "#{pane_current_path}"
bind -N "Fechar janela" k kill-window

# Alt+1..9 vai direto pra janela; Alt+setas anda; com Shift: troca de lugar
bind -N "Ir pra janela N (Alt+1..9)" -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -N "Janela anterior" -n M-Left select-window -t -1
bind -N "Próxima janela" -n M-Right select-window -t +1
bind -N "Mover janela pra esquerda" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Mover janela pra direita" -n M-S-Right swap-window -t +1 \; select-window -t +1

# --- Sessões ---
bind -N "Renomear sessão" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Nova sessão (mesma pasta)" C new-session -c "#{pane_current_path}"
bind -N "Fechar sessão" K kill-session
bind P switch-client -p
bind N switch-client -n

bind -N "Sessão anterior" -n M-Up switch-client -p
bind -N "Próxima sessão" -n M-Down switch-client -n

# --- Copy mode estilo vi (v seleciona, y copia pro clipboard do Wayland) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# --- Geral ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
# Fechar a última janela de uma sessão pula pra outra sessão em vez de sair
set -g detach-on-destroy off

# Nome da janela = pasta atual
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# --- Tema: ANSI puro, segue a paleta do kitty ---
# Papéis: ativo colour7, apagado colour8, destaque verde (colour10 vivo,
# colour2 escuro), atenção colour11, erro colour9. O verde existe nas três
# paletas do `cor` (vga, fosforo, grafite), então o destaque troca junto.
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour10"
set -g popup-border-style "fg=colour10"
set -g popup-border-lines single
set -g message-style "fg=colour0,bg=colour10"
set -g message-command-style "fg=colour10,bg=colour0"
set -g mode-style "fg=colour0,bg=colour2"
set -g clock-mode-colour colour10
set -g clock-mode-style 24
set -g display-panes-active-colour colour10
set -g display-panes-colour colour8

# Status no topo, texto puro. Sem relógio: a waybar já mostra a hora.
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=colour7,bg=default"
set -g status-left-length 40
set -g status-right-length 100

# Sessão em verde escuro; no prefix acende (verde vivo, negrito). Em copy mode
# aparece um bloco amarelo do lado dizendo o modo.
set -g status-left "#{?client_prefix,#[fg=colour0 bg=colour10 bold],#[fg=colour0 bg=colour2]} #S #[default]#{?pane_in_mode,#[fg=colour0 bg=colour11] #{pane_mode} #[default],} "

# Janelas: a atual em dois tons (número no verde, nome invertido como a waybar
# e as abas do kitty); as outras com número verde escuro e nome apagado.
# Janela com saída nova em segundo plano fica amarela.
set -g window-status-separator " "
set -g window-status-current-format "#[fg=colour0,bg=colour10,bold] #I #[fg=colour0,bg=colour7,nobold] #W#{?window_zoomed_flag, [z],} #[default]"
set -g window-status-format "#[fg=colour2] #I #[fg=colour8]#W#{?window_zoomed_flag, [z],}#{?window_last_flag, -,} #[default]"
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style "fg=colour11"
set -g window-status-bell-style "fg=colour9,bold"

# Direita: pasta apagada (~ no lugar do $HOME) e branch em verde escuro. Os #
# da branch são escapados pra um nome esquisito não virar código de estilo.
set -g @home "$HOME"
set -g status-right "#[fg=colour8]#{s|^#{@home}|~|:pane_current_path}#[fg=colour2]#(cd #{q:pane_current_path} && git branch --show-current 2>/dev/null | sed 's/#/##/g; s/^/  /') "

# --- Sessionizer: prefix f escolhe uma pasta do zoxide e entra na sessão dela ---
bind -N "Sessionizer: pasta do zoxide vira sessão" f display-popup -E -w 60% -h 50% "sessao"
