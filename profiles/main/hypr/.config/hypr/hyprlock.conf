# Lock na identidade do resto: fundo sólido da paleta, raio 0, fonte do terminal.
# Fundo sólido de propósito: "path = screenshot" vazaria a tela (borrada) por trás do lock.
# Cores e fonte: hyprlock-atual.conf, gerado pelo `repinta`.
source = ~/.config/hypr/hyprlock-atual.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $bg
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 1
    inner_color = $bg
    outer_color = $dim
    check_color = $ok
    fail_color = $erro
    font_color = $fg
    fade_on_empty = false
    rounding = 0
    font_family = $font
    placeholder_text = senha
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 64
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}
