# Lock provisório (Fase 3). Identidade visual vem na Fase 4.
# Fundo sólido de propósito: "path = screenshot" vazaria a tela (borrada) por trás do lock.
$font = JetBrains Mono

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(17, 17, 17)
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgb(143, 143, 143)
    check_color = rgb(0, 255, 153)
    fail_color = rgb(255, 0, 102)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    rounding = 0
    font_family = $font
    placeholder_text = senha
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}
