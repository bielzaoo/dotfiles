# Lock na identidade do modo. Fundo sólido de propósito: "path = screenshot"
# vazaria a tela (borrada) por trás do lock.
# Cores E FORMA (cantos, borda, tamanho, relógio) vêm do hyprlock-atual.conf,
# gerado pelo `repinta` por modo: Terminal reto/borda sólida, Desktop com cantos
# e borda em degradê blue->lavender.
source = ~/.config/hypr/hyprlock-atual.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $bg
}

input-field {
    monitor =
    size = $fieldsize
    outline_thickness = $outline
    inner_color = $bg
    outer_color = $outer
    check_color = $ok
    fail_color = $erro
    font_color = $fg
    fade_on_empty = false
    rounding = $round
    font_family = $font
    placeholder_text = senha
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = $clocksize
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}
