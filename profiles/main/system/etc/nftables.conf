#!/usr/bin/nft -f
# Recria SO a tabela inet filter. Nao usar "flush ruleset": isso apaga
# tambem as tabelas que o libvirt cria (NAT/DHCP das VMs) e a rede delas
# morre ate um "virsh net-destroy/net-start default".
table inet filter
delete table inet filter

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept

    # VMs do libvirt (virbr0): DHCP e DNS servidos pelo dnsmasq do host
    iifname "virbr0" udp dport { 53, 67 } accept
    iifname "virbr0" tcp dport 53 accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;

    # VMs saem para a internet (NAT do libvirt); so volta o que elas pediram
    iifname "virbr0" accept
    oifname "virbr0" ct state established,related accept
  }

  chain output { type filter hook output priority 0; policy accept; }
}
