# Tema ring0: a tela da senha do LUKS é o POST do wallpaper `fundo boot`
# parado no prompt. Gerado por `fundo plymouth` (system/usr/share/plymouth/
# themes/ring0); mudou tema ou este arquivo, o bootstrap.sh regera os UKIs.
[Daemon]
Theme=ring0
# Sem atraso: a tela aparece já no prompt, sem piscar o console antes
ShowDelay=0
