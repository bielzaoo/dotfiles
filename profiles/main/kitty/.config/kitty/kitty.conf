# Fonte: trocar com `fonte <cozette|spleen|terminus>` (symlink abaixo)
include fonte-atual.conf
# Paleta: trocar com `cor <vga|fosforo|grafite>` (symlink abaixo)
include cor-atual.conf
# Cores das abas e bordas de split, geradas da paleta pelo `repinta`
include abas-atual.conf

# Margem interna em volta do texto (px)
window_padding_width 4

# Cursor: bloco fixo, sem piscar e sem rastro
cursor_shape block
cursor_blink_interval 0
cursor_trail 0
shell_integration no-cursor

# Rolagem: 10k linhas na tela; Ctrl+Shift+H abre o histórico inteiro no less
scrollback_lines 10000
scrollback_pager_history_size 64

# Sem sino (nem som, nem piscada)
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell no

# Só pergunta antes de fechar se tiver programa rodando (ssh, vim...), não com shell parado
confirm_os_window_close -1

# Links: clique abre, sublinhado reto
url_style straight
open_url_with default
# Ao copiar, tira espaço do fim das linhas
strip_trailing_spaces smart

# Abas (Ctrl+Shift+T nova na mesma pasta, Ctrl+Shift+←/→ troca): só aparecem
# com 2+, embaixo, texto puro com a ativa invertida (como a waybar)
tab_bar_edge bottom
tab_bar_style separator
tab_separator ""
tab_title_template " {index}:{title} "
tab_title_max_length 30
map kitty_mod+t new_tab_with_cwd

# Splits dentro da janela (o Hyprland cuida das janelas; isto é pro caso rápido).
# Ctrl+Shift+Enter divide (orientação pelo formato), Ctrl+Shift+\ gira,
# Ctrl+Shift+M maximiza/volta, Alt+h/j/k/l navega, Ctrl+Shift+R redimensiona
enabled_layouts splits,stack
map kitty_mod+enter     launch --location=split --cwd=current
map kitty_mod+backslash layout_action rotate
map kitty_mod+m         toggle_layout stack
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
