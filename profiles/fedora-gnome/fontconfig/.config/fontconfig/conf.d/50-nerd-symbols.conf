<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Ícones da Nerd Font (Symbols Nerd Font, instalada pelo setup.sh com
  INSTALL_NERD_SYMBOLS=1) logo DEPOIS da fonte do terminal: o texto
  continua vindo da JetBrains Mono (mesmas métricas), e os ícones vêm
  daqui em vez de cair em fonte qualquer do sistema que use a mesma
  faixa Unicode (ex.: Jomolhari). O 10-nerd-font-symbols.conf oficial usa
  <prefer>, que põe os símbolos ANTES da fonte; aqui é <accept>.
-->
<fontconfig>
  <alias>
    <family>JetBrains Mono</family>
    <accept><family>Symbols Nerd Font Mono</family></accept>
  </alias>
  <alias>
    <family>monospace</family>
    <accept><family>Symbols Nerd Font Mono</family></accept>
  </alias>
</fontconfig>
