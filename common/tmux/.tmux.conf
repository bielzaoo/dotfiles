# ============================================================
# vantablack.tmux.conf — adaptado com accent crimson
# ============================================================

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 10
set -g history-limit 10000
bind | split-window -h
bind - split-window -v

# --- Pane borders ---
set -g pane-border-style "fg=#303030,bg=#0a0a0a"
set -g pane-active-border-style "fg=#c41e1e,bg=#0a0a0a"

# --- Message / command area ---
set -g message-style "fg=#e0e0e0,bg=#141414"
set -g message-command-style "fg=#c8c8c8,bg=#141414"

# --- Mode (copy mode, etc.) ---
set -g mode-style "fg=#0a0a0a,bg=#c41e1e"

# --- Status bar ---
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "fg=#9a9a9a,bg=#0a0a0a"

# LEFT: [session / PREFIX] [programa atual]
set -g status-left-length 60
set -g status-left "#[fg=#0a0a0a,bg=#c41e1e,bold] #{?client_prefix,PREFIX,#S} #[fg=#c41e1e,bg=#888888]#[fg=#0a0a0a,bg=#888888,bold] #{pane_current_command} #[fg=#888888,bg=#0a0a0a]#[fg=#303030,bg=#0a0a0a] "

# RIGHT: [git branch] [hora] [data]
set -g status-right-length 80
set -g status-right "#[fg=#505050,bg=#0a0a0a]#[fg=#9a9a9a,bg=#505050] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /') #[fg=#888888,bg=#505050]#[fg=#c8c8c8,bg=#888888,bold]  %H:%M #[fg=#e0e0e0,bg=#888888]#[fg=#0a0a0a,bg=#e0e0e0,bold] %a %d %b %Y "

# WINDOW LIST
set -g status-justify left
set -g window-status-format "#[fg=#0a0a0a,bg=#303030]#[fg=#7a7a7a,bg=#303030] #I  #W #[fg=#303030,bg=#0a0a0a]"
set -g window-status-current-format "#[fg=#0a0a0a,bg=#c41e1e]#[fg=#f9f6f0,bg=#c41e1e,bold] #I  #W #[fg=#c41e1e,bg=#0a0a0a]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#b0b0b0,bg=#0a0a0a"
set -g window-status-bell-style "fg=#ff3b3b,bg=#0a0a0a,bold"

# CLOCK MODE
set -g clock-mode-colour "#9a9a9a"
set -g clock-mode-style 24
