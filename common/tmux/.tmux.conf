# ============================================================
# tmux.conf
# Config principal (prefix, binds, mouse etc.) — pode mudar à vontade.
# Keybinds no esquema do Omarchy: Ctrl+Alt+setas pros painéis, Alt+número
# e Alt+setas pras janelas, sem prefix pro que é usado toda hora.
# O esquema de cores mora em ~/.tmux/themes/ e é importado separado,
# pra dar pra levar só o tema pra outra máquina sem esses ajustes.
# ============================================================

# --- Prefix: Ctrl+Space (Omarchy), Ctrl+a continua valendo ---
set -g prefix C-Space
set -g prefix2 C-a
bind C-Space send-prefix

# Recarrega a config
bind q source-file ~/.tmux.conf \; display "Config recarregada"

# --- Painéis ---
# h = divide na horizontal (um embaixo do outro), v = lado a lado
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

# Ctrl+Alt+setas: muda de painel; com Shift: redimensiona
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D

bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# --- Janelas ---
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

# Alt+1..9 vai direto pra janela; Alt+setas anda; com Shift: troca de lugar
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# --- Sessões ---
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# --- Copy mode estilo vi (v seleciona, y copia pro clipboard via OSC 52) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Geral ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# Abre zsh mesmo se o shell de login do usuário ainda for bash (o kitty
# força zsh com `shell`, mas o tmux usaria o $SHELL).
if-shell "[ -x /usr/bin/zsh ]" "set -g default-shell /usr/bin/zsh"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
# Fechar a última janela de uma sessão pula pra outra sessão em vez de sair
set -g detach-on-destroy off

# Nome da janela = pasta atual
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# --- Status bar ---
set -g status-position top
set -g status-interval 5

# --- Tema (esquema de cores) ---
source-file "~/.tmux/themes/vantablack.conf"   # ou tokyo-night-black.conf / catppuccin-black.conf / catppuccin-mocha.conf
