# ============================================================
# tmux.conf
# Config principal (prefix, binds, mouse etc.) — pode mudar à vontade.
# O esquema de cores mora em ~/.tmux/themes/ e é importado separado,
# pra dar pra levar só o tema pra outra máquina sem esses ajustes.
# ============================================================

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 10
set -g history-limit 10000
bind | split-window -h
bind - split-window -v

# --- Tema (esquema de cores) ---
source-file "~/.tmux/themes/catppuccin-mocha.conf"
