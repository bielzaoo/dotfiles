# ============================================================
# tmux.conf — tema Catppuccin Mocha
# Base: tema do profile quickshell (separadores slant, Nerd Font),
# recolorido pra paleta oficial do Catppuccin Mocha (accent: Sky #89dceb)
# ============================================================

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g escape-time 10
set -g history-limit 10000
bind | split-window -h
bind - split-window -v

# --- Pane borders ---
set -g pane-border-style "fg=#45475a,bg=#11111b"
set -g pane-active-border-style "fg=#89dceb,bg=#11111b"

# --- Message / command area ---
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#bac2de,bg=#1e1e2e"

# --- Mode (copy mode, etc.) ---
set -g mode-style "fg=#11111b,bg=#89dceb"

# --- Status bar ---
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "fg=#a6adc8,bg=#11111b"

# LEFT: [session / PREFIX] [programa atual]
set -g status-left-length 60
set -g status-left "#[fg=#11111b,bg=#89dceb,bold] #{?client_prefix,PREFIX,#S} #[fg=#89dceb,bg=#1e1e2e]#[fg=#cdd6f4,bg=#1e1e2e,bold] #{pane_current_command} #[fg=#1e1e2e,bg=#11111b]#[fg=#45475a,bg=#11111b] "

# RIGHT: [git branch] [hora] [data]
set -g status-right-length 80
set -g status-right "#[fg=#1e1e2e,bg=#11111b]#[fg=#7f849c,bg=#1e1e2e] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /') #[fg=#313244,bg=#1e1e2e]#[fg=#89dceb,bg=#313244,bold]  %H:%M #[fg=#1e1e2e,bg=#313244]#[fg=#7f849c,bg=#1e1e2e] %a %d %b %Y "

# WINDOW LIST
set -g status-justify left
set -g window-status-format "#[fg=#11111b,bg=#1e1e2e]#[fg=#6c7086,bg=#1e1e2e] #I  #W #[fg=#1e1e2e,bg=#11111b]"
set -g window-status-current-format "#[fg=#11111b,bg=#89dceb]#[fg=#11111b,bg=#89dceb,bold] #I  #W #[fg=#89dceb,bg=#11111b]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#bac2de,bg=#11111b"
set -g window-status-bell-style "fg=#f38ba8,bg=#11111b,bold"

# CLOCK MODE
set -g clock-mode-colour "#89dceb"
set -g clock-mode-style 24
