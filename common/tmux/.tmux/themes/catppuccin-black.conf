# ============================================================
# catppuccin-black.conf — esquema de cores tmux (Catppuccin Mocha, fundo preto)
# Só o tema: pane borders, status bar (segmentos com separadores
# slant, Nerd Font), mode e clock. Sem prefix/binds/keymaps —
# esse arquivo é auto-contido, dá pra copiar pra ~/.tmux/themes/
# em qualquer outra máquina e dar source em qualquer .tmux.conf.
# Accent: Sky #89dceb. Mesmas cores do catppuccin-mocha.conf, mas os fundos
# (base/mantle/crust/surfaces) viram preto e cinzas neutros, pra combinar
# com terminal de fundo preto puro.
# ============================================================

# --- Pane borders ---
set -g pane-border-style "fg=#303030,bg=default"
set -g pane-active-border-style "fg=#89dceb,bg=default"

# --- Message / command area ---
set -g message-style "fg=#cdd6f4,bg=#262626"
set -g message-command-style "fg=#bac2de,bg=#121212"

# --- Mode (copy mode, etc.) ---
set -g mode-style "fg=#000000,bg=#89dceb"

# --- Status bar ---
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "fg=#a6adc8,bg=#000000"

# LEFT: [session / PREFIX] [programa atual]
set -g status-left-length 60
set -g status-left "#[fg=#000000,bg=#89dceb,bold] #{?client_prefix,PREFIX,#S} #[fg=#89dceb,bg=#121212]#[fg=#cdd6f4,bg=#121212,bold] #{pane_current_command} #[fg=#121212,bg=#000000]#[fg=#303030,bg=#000000] "

# RIGHT: [git branch] [hora] [data]
set -g status-right-length 80
set -g status-right "#[fg=#000000,bg=#121212]#[fg=#7f849c,bg=#121212] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /') #[fg=#121212,bg=#262626]#[fg=#89dceb,bg=#262626,bold]  %H:%M #[fg=#262626,bg=#121212]#[fg=#7f849c,bg=#121212] %a %d %b %Y "

# WINDOW LIST
set -g status-justify left
set -g window-status-format "#[fg=#000000,bg=#121212]#[fg=#6c7086,bg=#121212] #I  #W #[fg=#121212,bg=#000000]"
set -g window-status-current-format "#[fg=#000000,bg=#89dceb]#[fg=#000000,bg=#89dceb,bold] #I  #W #[fg=#89dceb,bg=#000000]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#bac2de,bg=#000000"
set -g window-status-bell-style "fg=#f38ba8,bg=#000000,bold"

# CLOCK MODE
set -g clock-mode-colour "#89dceb"
set -g clock-mode-style 24
