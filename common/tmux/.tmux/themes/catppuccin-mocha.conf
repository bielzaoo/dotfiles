# ============================================================
# catppuccin-mocha.conf — esquema de cores tmux (Catppuccin Mocha)
# Só o tema: pane borders, status bar (segmentos com separadores
# slant, Nerd Font), mode e clock. Sem prefix/binds/keymaps —
# esse arquivo é auto-contido, dá pra copiar pra ~/.tmux/themes/
# em qualquer outra máquina e dar source em qualquer .tmux.conf.
# Accent: Sky #89dceb
# ============================================================

# --- Pane borders ---
set -g pane-border-style "fg=#45475a,bg=default"
set -g pane-active-border-style "fg=#89dceb,bg=default"

# --- Message / command area ---
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#bac2de,bg=#1e1e2e"

# --- Mode (copy mode, etc.) ---
set -g mode-style "fg=#11111b,bg=#89dceb"

# --- Status bar ---
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "fg=#a6adc8,bg=#11111b"

# LEFT: [session / PREFIX] [programa atual]
set -g status-left-length 60
set -g status-left "#[fg=#11111b,bg=#89dceb,bold] #{?client_prefix,PREFIX,#S} #[fg=#89dceb,bg=#1e1e2e]#[fg=#cdd6f4,bg=#1e1e2e,bold] #{pane_current_command} #[fg=#1e1e2e,bg=#11111b]#[fg=#45475a,bg=#11111b] "

# RIGHT: [git branch] [hora] [data]
set -g status-right-length 80
set -g status-right "#[fg=#11111b,bg=#1e1e2e]#[fg=#7f849c,bg=#1e1e2e] #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /') #[fg=#1e1e2e,bg=#313244]#[fg=#89dceb,bg=#313244,bold]  %H:%M #[fg=#313244,bg=#1e1e2e]#[fg=#7f849c,bg=#1e1e2e] %a %d %b %Y "

# WINDOW LIST
set -g status-justify left
set -g window-status-format "#[fg=#11111b,bg=#1e1e2e]#[fg=#6c7086,bg=#1e1e2e] #I  #W #[fg=#1e1e2e,bg=#11111b]"
set -g window-status-current-format "#[fg=#11111b,bg=#89dceb]#[fg=#11111b,bg=#89dceb,bold] #I  #W #[fg=#89dceb,bg=#11111b]"
set -g window-status-separator ""
set -g window-status-activity-style "fg=#bac2de,bg=#11111b"
set -g window-status-bell-style "fg=#f38ba8,bg=#11111b,bold"

# CLOCK MODE
set -g clock-mode-colour "#89dceb"
set -g clock-mode-style 24
