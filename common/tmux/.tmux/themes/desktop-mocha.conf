# ============================================================
# desktop-mocha.conf — tema tmux do Desktop Mode (Catppuccin Mocha + azul)
# Cópia avulsa do que o `repinta` gera em ~/.config/tmux/tema-atual.conf no
# Desktop Mode (perfil main), congelada em hex: não depende do repinta, do
# kitty nem da paleta ANSI do terminal. Auto-contido como os outros temas
# daqui: copie pra ~/.tmux/themes/ e dê source em qualquer .tmux.conf.
# Barra no topo à la tokyo-night-tmux: sessão em pílula (ícone muda no
# prefix), janela ativa em bloco superfície, pasta + branch, relógio.
# Precisa de Nerd Font (meias-luas e ícones).
# Se mudar o visual no repinta, atualize aqui também (não sincroniza sozinho).
# ============================================================

# --- Bordas, mensagens, modos ---
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#89b4fa"
set -g popup-border-style "fg=#89b4fa"
set -g popup-border-lines single
set -g message-style "fg=#45475a,bg=#89b4fa"
set -g message-command-style "fg=#89b4fa,bg=#45475a"
set -g mode-style "fg=#45475a,bg=#89b4fa"
set -g clock-mode-colour "#89b4fa"
set -g clock-mode-style 24
set -g display-panes-active-colour "#89b4fa"
set -g display-panes-colour "#585b70"

# --- Barra de status ---
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=#bac2de,bg=#181825"
set -g status-left-length 40
set -g status-right-length 120

# Sessão em pílula azul; o ícone vira  no prefix; modo (copy etc.) em amarelo
set -g status-left "#[fg=#89b4fa,bg=#181825]#[fg=#181825,bg=#89b4fa,bold]#{?client_prefix, , }#S#[fg=#89b4fa,bg=#181825,nobold] #{?pane_in_mode,#[fg=#181825 bg=#f9e2af bold] #{pane_mode} #[bg=#181825 nobold] ,}"

# Janelas: ativa em bloco surface0, inativas soltas
set -g window-status-separator ""
set -g window-status-style "default"
set -g window-status-current-style "default"
set -g window-status-current-format "#[fg=#313244,bg=#181825]#[fg=#cba6f7,bg=#313244] #[fg=#cdd6f4,bold]#I#[nobold,fg=#9399b2]:#[fg=#cdd6f4,bold]#W#{?window_zoomed_flag, #[fg=#f9e2af],}#[fg=#313244,bg=#181825]#[default]"
set -g window-status-format "#[fg=#9399b2]  #[fg=#bac2de]#I#[fg=#9399b2]:#[fg=#bac2de]#W#{?window_zoomed_flag, #[fg=#f9e2af],}#{?window_last_flag, #[fg=#9399b2],} #[default]"
set -g window-status-activity-style "fg=#f9e2af"
set -g window-status-bell-style "fg=#f38ba8,bold"

# Direita: pasta (home vira ~), branch do git, relógio em bloco
set -g @home "$HOME"
set -g status-right "#[fg=#9399b2] #[fg=#bac2de]#{s|^#{@home}|~|:pane_current_path} #[fg=#cba6f7]#(cd #{q:pane_current_path} && git branch --show-current 2>/dev/null | sed 's/#/##/g; s/^/ /; s/$/ /')#[fg=#313244,bg=#181825]#[fg=#cdd6f4,bg=#313244,bold] %H:%M#[fg=#313244,bg=#181825,nobold]#[default]"
