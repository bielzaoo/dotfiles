# ============================================================
# vantablack.conf — esquema de cores tmux
# Mesmo layout do tokyo-night-black.conf (sessão com ícone que muda no
# prefix, janelas com ícone, pasta, branch e data ❬ hora), nas cores do
# vantablack.nvim (github.com/bjarneo/vantablack.nvim): tons de cinza,
# fundo #0d0d0d igual ao do Neovim e ao do kitty (vantablack.conf).
# Auto-contido como os outros temas daqui, dá pra copiar pra
# ~/.tmux/themes/ e dar source em qualquer .tmux.conf.
# Os ícones são Nerd Font (o kitty já traz os símbolos embutidos).
# ============================================================

# --- Pane borders ---
set -g pane-border-style "fg=#1a1a1a,bg=default"
set -g pane-active-border-style "fg=#a0a0a0,bg=default"
set -g pane-border-status off
set -g popup-border-style "fg=#a0a0a0"

# --- Message / command area ---
set -g message-style "fg=#0d0d0d,bg=#e0e0e0"
set -g message-command-style "fg=#e0e0e0,bg=#1a1a1a"

# --- Mode (copy mode, etc.) ---
set -g mode-style "fg=#e0e0e0,bg=#2a2a2a"

# --- Status bar ---
set -g status on
set -g status-style "fg=#e0e0e0,bg=#0d0d0d"
set -g status-justify left
set -g status-left-length 80
set -g status-right-length 150

# LEFT: sessão. Ícone apagado normalmente; no prefix o bloco fica cinza
# escuro com texto claro (não tem cor pra destacar num tema sem cor).
set -g status-left "#[fg=#0d0d0d,bg=#e0e0e0,bold]#{?client_prefix,#[fg=#e0e0e0]#[bg=#505050] 󰠠 ,#[dim] 󰤂 }#[nodim]#S #[default] "

# WINDOW LIST: ícone de terminal (ou de ssh), número e nome; 󰊓 se zoom.
# A atual ganha fundo; a anterior (prefix l) leva um 󰁯.
set -g window-status-separator ""
set -g window-status-current-format "#[fg=#c8c8c8,bg=#1a1a1a] #{?#{==:#{pane_current_command},ssh},󰣀,} #[fg=#e0e0e0,bold]#I #W#{?window_zoomed_flag, 󰊓,} #[default]"
set -g window-status-format "#[fg=#7a7a7a] #{?#{==:#{pane_current_command},ssh},󰣀,} #I #W#{?window_zoomed_flag, 󰊓,}#[fg=#b0b0b0]#{?window_last_flag, 󰁯,} #[default]"
set -g window-status-activity-style "fg=#c8c8c8,bg=#0d0d0d"
set -g window-status-bell-style "fg=#e0e0e0,bg=#0d0d0d,bold"

# RIGHT: [pasta] [branch] [data ❬ hora]
# A pasta troca o $HOME por ~. A branch tem os # escapados pra um nome
# esquisito não virar código de estilo do tmux.
set -g @tn_home "$HOME"
set -g status-right "#[fg=#505050]░  #[fg=#9a9a9a]#{s|^#{@tn_home}|~|:pane_current_path} #[fg=#b8b8b8]#(cd #{q:pane_current_path} && git branch --show-current 2>/dev/null | sed 's/#/##/g; s/^/ /') #[fg=#e0e0e0,bg=#1a1a1a] %d/%m/%Y ❬ %H:%M #[default]"

# CLOCK MODE
set -g clock-mode-colour "#e0e0e0"
set -g clock-mode-style 24
