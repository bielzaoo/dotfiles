# ============================================================
# tokyo-night-black.conf — esquema de cores tmux
# Layout do tokyo-night-tmux (github.com/janoamaral/tokyo-night-tmux):
# bloco da sessão com ícone que muda no prefix, janelas com ícone de
# terminal e marcador da última janela, e à direita pasta, branch e
# data ❬ hora. As cores são as do kitty (Catppuccin Mocha, fundo preto,
# accent Sky #89dceb), no lugar das do Tokyo Night.
# Feito em tmux puro, sem os scripts do plugin (nem TPM): só a branch
# roda um comando. Auto-contido como os outros temas daqui, dá pra
# copiar pra ~/.tmux/themes/ e dar source em qualquer .tmux.conf.
# Os ícones são Nerd Font (o kitty já traz os símbolos embutidos).
# ============================================================

# --- Pane borders ---
set -g pane-border-style "fg=#303030,bg=default"
set -g pane-active-border-style "fg=#89dceb,bg=default"
set -g pane-border-status off
set -g popup-border-style "fg=#89dceb"

# --- Message / command area ---
set -g message-style "fg=#000000,bg=#89dceb"
set -g message-command-style "fg=#89dceb,bg=#262626"

# --- Mode (copy mode, etc.) ---
set -g mode-style "fg=#000000,bg=#89dceb"

# --- Status bar ---
set -g status on
set -g status-style "fg=#cdd6f4,bg=#000000"
set -g status-justify left
set -g status-left-length 80
set -g status-right-length 150

# LEFT: sessão. Ícone apagado normalmente; no prefix o bloco fica amarelo.
set -g status-left "#[fg=#000000,bg=#89dceb,bold]#{?client_prefix,#[bg=#f9e2af] 󰠠 ,#[dim] 󰤂 }#[nodim]#S #[default] "

# WINDOW LIST: ícone de terminal (ou de ssh), número e nome; 󰊓 se zoom.
# A atual ganha fundo; a anterior (prefix l) leva um 󰁯 amarelo.
set -g window-status-separator ""
set -g window-status-current-format "#[fg=#a6e3a1,bg=#262626] #{?#{==:#{pane_current_command},ssh},󰣀,} #[fg=#cdd6f4,bold]#I #W#{?window_zoomed_flag, 󰊓,} #[default]"
set -g window-status-format "#[fg=#6c7086] #{?#{==:#{pane_current_command},ssh},󰣀,} #I #W#{?window_zoomed_flag, 󰊓,}#[fg=#f9e2af]#{?window_last_flag, 󰁯,} #[default]"
set -g window-status-activity-style "fg=#bac2de,bg=#000000"
set -g window-status-bell-style "fg=#f38ba8,bg=#000000,bold"

# RIGHT: [pasta] [branch] [data ❬ hora]
# A pasta troca o $HOME por ~. A branch tem os # escapados pra um nome
# esquisito não virar código de estilo do tmux.
set -g @tn_home "$HOME"
set -g status-right "#[fg=#89dceb]░  #[fg=#a6adc8]#{s|^#{@tn_home}|~|:pane_current_path} #[fg=#cba6f7]#(cd #{q:pane_current_path} && git branch --show-current 2>/dev/null | sed 's/#/##/g; s/^/ /') #[fg=#cdd6f4,bg=#262626] %d/%m/%Y ❬ %H:%M #[default]"

# CLOCK MODE
set -g clock-mode-colour "#89dceb"
set -g clock-mode-style 24
