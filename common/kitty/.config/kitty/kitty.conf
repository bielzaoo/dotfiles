# ============================================================
# kitty.conf
# Só o que foge do padrão; referência completa das opções:
# https://sw.kovidgoyal.net/kitty/conf/
# ============================================================

shell /usr/bin/zsh

# --- Fonte ---
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

# --- Cursor: rastro animado quando o cursor pula de lugar ---
cursor_trail                 200
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# --- Janela ---
remember_window_size  yes
initial_window_width  640
initial_window_height 400
window_padding_width  10
# Barra de título fica a cargo do KDE (Klassy, botões estilo mac).
hide_window_decorations no

# --- Barra de abas (aparece com 2+ abas; Ctrl+Shift+T abre uma) ---
tab_bar_edge           top
tab_bar_margin_width   6
tab_bar_margin_height  6 0
tab_bar_style          powerline
tab_powerline_style    round
tab_title_max_length   30
tab_activity_symbol    "● "
bell_on_tab            "󰂞 "
tab_title_template     " {index}  {bell_symbol}{activity_symbol}{title} "

# --- Comportamento ---
mouse_hide_wait -3.0
scrollback_pager_history_size 10
# Notifica quando um comando de 20s+ termina com o kitty fora de vista.
notify_on_cmd_finish invisible 20

# --- Cores (Catppuccin Mocha com fundo preto) ---
include catppuccin-black.conf
