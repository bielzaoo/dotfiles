# Vantablack — mesma paleta do vantablack.nvim (github.com/bjarneo/vantablack.nvim):
# interface em tons de cinza, fundo #0d0d0d. O fundo tem que ser igual ao do
# Neovim, senão aparece uma moldura entre o nvim e o padding do kitty.
# Accent: o próprio foreground #e0e0e0. As cores ANSI têm cor (ver abaixo).

foreground              #E0E0E0
background              #0D0D0D
selection_foreground    #E0E0E0
selection_background    #2A2A2A
url_color               #B8B8B8

# Cursor (o rastro do cursor_trail usa essa mesma cor)
cursor                  #E0E0E0
cursor_text_color       #0D0D0D

# Bordas entre splits
active_border_color     #A0A0A0
inactive_border_color   #1A1A1A
bell_border_color       #C8C8C8

# Barra de abas
tab_bar_background      #0D0D0D
active_tab_foreground   #0D0D0D
active_tab_background   #E0E0E0
inactive_tab_foreground #7A7A7A
inactive_tab_background #1A1A1A

# Marks
mark1_foreground #0D0D0D
mark1_background #C8C8C8
mark2_foreground #0D0D0D
mark2_background #A0A0A0
mark3_foreground #0D0D0D
mark3_background #888888

# 16 cores do terminal. A interface (fundo, abas, bordas) segue os cinzas
# do plugin, mas as cores ANSI são cores de verdade, só que apagadas
# pra combinar com o fundo. Assim, eza/ls/git continuam diferenciando
# pasta, executável, link etc. O Neovim não usa essas cores (ele tem as
# dele), então continua todo cinza. O color0 é #1a1a1a, e não o fundo,
# pra texto "preto" não sumir.
color0  #1A1A1A
color8  #505050
color1  #CC7A7A
color9  #E09090
color2  #8FB08A
color10 #A3C49E
color3  #D4B878
color11 #E6CC8F
color4  #7F9FC4
color12 #98B4D6
color5  #B392C0
color13 #C7A8D4
color6  #7FB0B0
color14 #96C4C4
color7  #C8C8C8
color15 #E0E0E0
